<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Shadow Games">
  <defs>
    <clipPath id="cut">
      <polygon points="0,0 480,0 480,180 0,360" />
    </clipPath>
    <clipPath id="cut-lower">
      <polygon points="0,360 480,180 480,480 0,480" />
    </clipPath>
  </defs>
  <rect width="480" height="480" rx="64" fill="#0e0c16"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="360" text-anchor="middle">
    <g clip-path="url(#cut)">
      <text x="240" y="350" fill="#181534">S</text>
    </g>
    <g clip-path="url(#cut-lower)">
      <text x="240" y="350" fill="#8b5cf6">S</text>
    </g>
  </g>
</svg>
