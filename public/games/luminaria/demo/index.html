<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Luminaria — Demo</title>
<!--
  Demo HTML5 self-hosted de ShadowGames — "Luminaria".
  Archivo único, sin dependencias ni terceros: se ejecuta en la misma página
  dentro de un <iframe> same-origin (patrón "tipo itch.io" pero en nuestro dominio).
  Para sustituir por un build real (Godot/Unity/Jabalí exportado a WebGL):
  reemplaza el contenido de public/games/luminaria/demo/ por el export del motor
  (manteniendo un index.html como punto de entrada). La página de detalle no
  cambia: sigue apuntando a "/games/luminaria/demo/index.html".
-->
<style>
  :root {
    --bg: #0a0812;
    --ink: #f4f1ff;
    --violet: #a78bfa;
    --violet-deep: #6d4ad6;
    --ember: #e7a95c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 30% 10%, rgba(167,139,250,0.18) 0%, transparent 55%),
      radial-gradient(100% 80% at 80% 90%, rgba(231,169,92,0.10) 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
    height: 100%;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .hud b { color: var(--violet); font-weight: 700; }
  .hud .ember { color: var(--ember); }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(10,8,18,0.72);
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .card { max-width: 460px; }
  .card h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 7vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(120deg, var(--violet), var(--ember));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .card p { color: rgba(244,241,255,0.72); font-size: 0.98rem; line-height: 1.5; margin-bottom: 22px; }
  .card .big { font-size: 1.1rem; color: var(--ink); }
  .card .big b { color: var(--ember); }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 600;
    color: #fff;
    background: var(--violet-deep);
    padding: 14px 30px;
    min-height: 48px;
    border-radius: 999px;
    box-shadow: 0 0 50px -10px rgba(167,139,250,0.7);
    transition: filter .15s ease, transform .15s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
  .keys { margin-top: 16px; font-size: 0.82rem; color: rgba(244,241,255,0.5); }
  kbd {
    display: inline-block; padding: 2px 7px; margin: 0 1px;
    border: 1px solid rgba(244,241,255,0.25); border-radius: 6px;
    font-size: 0.78rem; background: rgba(255,255,255,0.04);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hud">
      <div>Luz&nbsp; <b id="score">0</b></div>
      <div class="ember">⏱ <b id="time">30</b>s</div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h1>Luminaria</h1>
        <p id="lead">Pinta de luz. Recoge las motas antes de que el tiempo se apague.</p>
        <p class="big" id="result" style="display:none"></p>
        <button id="start">▶ Empezar</button>
        <div class="keys">
          Mueve con el <kbd>ratón</kbd> o <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var startBtn = document.getElementById("start");
  var scoreEl = document.getElementById("score");
  var timeEl = document.getElementById("time");
  var resultEl = document.getElementById("result");
  var leadEl = document.getElementById("lead");

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  function resize() {
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // --- Estado ---
  var player = { x: 0, y: 0, r: 16 };
  var target = { x: 0, y: 0 };      // objetivo del ratón/teclado
  var motes = [];
  var particles = [];
  var keys = {};
  var score = 0, timeLeft = 30, running = false, last = 0, spawnT = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnMote() {
    var m = {
      x: rand(40, W - 40),
      y: rand(60, H - 40),
      r: rand(7, 12),
      pulse: Math.random() * Math.PI * 2,
      ember: Math.random() < 0.22          // motas brasa = +3
    };
    motes.push(m);
  }

  function burst(x, y, color) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2, sp = rand(0.6, 3.4);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: color });
    }
  }

  function reset() {
    score = 0; timeLeft = 30; motes = []; particles = [];
    player.x = W / 2; player.y = H / 2; target.x = player.x; target.y = player.y;
    for (var i = 0; i < 5; i++) spawnMote();
    spawnT = 0;
  }

  function start() {
    resize();
    reset();
    overlay.classList.add("hidden");
    running = true;
    last = 0;
    requestAnimationFrame(loop);
  }

  function end() {
    running = false;
    leadEl.style.display = "none";
    resultEl.style.display = "block";
    resultEl.innerHTML = "Reuniste <b>" + score + "</b> de luz.";
    startBtn.textContent = "↻ Jugar otra vez";
    overlay.classList.remove("hidden");
  }

  // --- Input ---
  function pointTo(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    target.x = clientX - r.left;
    target.y = clientY - r.top;
  }
  canvas.addEventListener("mousemove", function (e) { pointTo(e.clientX, e.clientY); });
  canvas.addEventListener("touchmove", function (e) {
    if (e.touches[0]) { pointTo(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches[0]) pointTo(e.touches[0].clientX, e.touches[0].clientY);
  });
  window.addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
    if (["arrowup", "arrowdown", "arrowleft", "arrowright"].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  function keyboardMove(dt) {
    var sp = 0.42 * dt;
    var dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;
    if (dx || dy) {
      var len = Math.hypot(dx, dy) || 1;
      target.x += (dx / len) * sp;
      target.y += (dy / len) * sp;
      target.x = Math.max(0, Math.min(W, target.x));
      target.y = Math.max(0, Math.min(H, target.y));
    }
  }

  // --- Loop ---
  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    var dt = Math.min(ts - last, 50);
    last = ts;

    timeLeft -= dt / 1000;
    if (timeLeft <= 0) { timeLeft = 0; timeEl.textContent = "0"; end(); draw(); return; }

    keyboardMove(dt);

    // El jugador persigue el objetivo con suavizado (sensación "pintada").
    player.x += (target.x - player.x) * Math.min(1, dt * 0.012);
    player.y += (target.y - player.y) * Math.min(1, dt * 0.012);

    // Spawns
    spawnT += dt;
    if (spawnT > 900 && motes.length < 9) { spawnMote(); spawnT = 0; }

    // Colisiones
    for (var i = motes.length - 1; i >= 0; i--) {
      var m = motes[i];
      m.pulse += dt * 0.005;
      var d = Math.hypot(m.x - player.x, m.y - player.y);
      if (d < player.r + m.r + 6) {
        score += m.ember ? 3 : 1;
        burst(m.x, m.y, m.ember ? "231,169,92" : "167,139,250");
        motes.splice(i, 1);
      }
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.94; pt.vy *= 0.94; pt.life -= dt / 700;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    scoreEl.textContent = String(score);
    timeEl.textContent = String(Math.ceil(timeLeft));

    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // rastro de oscuridad sutil
    ctx.fillStyle = "rgba(10,8,18,0.35)";
    ctx.fillRect(0, 0, W, H);

    // motas
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var glow = 0.6 + Math.sin(m.pulse) * 0.35;
      var col = m.ember ? "231,169,92" : "167,139,250";
      var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4);
      g.addColorStop(0, "rgba(" + col + "," + glow + ")");
      g.addColorStop(1, "rgba(" + col + ",0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(" + col + ",0.95)";
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }

    // partículas
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.fillStyle = "rgba(" + pt.color + "," + Math.max(0, pt.life) + ")";
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.4, 0, Math.PI * 2); ctx.fill();
    }

    // jugador — pincel de luz
    var pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 6);
    pg.addColorStop(0, "rgba(244,241,255,0.9)");
    pg.addColorStop(0.3, "rgba(167,139,250,0.55)");
    pg.addColorStop(1, "rgba(167,139,250,0)");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  startBtn.addEventListener("click", start);
  // Permite arrancar con Enter/Espacio desde el foco del botón (accesible).
  resize();
  draw();
})();
</script>
</body>
</html>
