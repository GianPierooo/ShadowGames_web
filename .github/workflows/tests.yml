name: tests

# Corre SOLO los tests offline (fixtures + unidades) en cada push/PR. NO corre el
# health-check en vivo (test:health), que depende de la red de las fuentes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install` (no `npm ci`) a propósito: el lock se genera en Windows y
      # no registra los binarios nativos de Linux (rollup/swc), así que `npm ci`
      # rompe en el runner por el bug de optionalDependencies de npm (npm/cli#4828).
      # `npm install` resuelve el binario correcto de la plataforma en CI.
      - run: npm install --no-audit --no-fund
      - run: npm run test:fixtures
